<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Kanban Board</title>
    <!-- For production, install Tailwind CSS as a PostCSS plugin: https://tailwindcss.com/docs/installation -->
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Authentication Container -->
    <div id="auth-container" class="flex items-center justify-center min-h-screen hidden">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
            <!-- Login Form -->
            <div id="login-view">
                <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Welcome Back</h2>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label for="login-email" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" id="login-email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="login-password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" autocomplete="current-password">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors font-semibold">
                        Sign In
                    </button>
                </form>
                <p class="mt-6 text-center text-sm text-gray-600">
                    Don't have an account? <a href="#" id="show-signup" class="font-medium text-blue-600 hover:text-blue-500">Sign Up</a>
                </p>
            </div>

            <!-- Signup Form -->
            <div id="signup-view" class="hidden">
                <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Create Your Account</h2>
                <form id="signup-form" class="space-y-4">
                    <div>
                        <label for="signup-email" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" id="signup-email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                    </div>
                    <div>
                        <label for="signup-password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="signup-password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" autocomplete="new-password">
                    </div>
                    <div>
                        <label for="signup-role" class="block text-sm font-medium text-gray-700">Role</label>
                        <select id="signup-role" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                            <option value="">Select a role</option>
                            <option value="Developer">Developer</option>
                            <option value="QA">QA</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition-colors font-semibold">
                        Sign Up
                    </button>
                </form>
                <p class="mt-6 text-center text-sm text-gray-600">
                    Already have an account? <a href="#" id="show-login" class="font-medium text-blue-600 hover:text-blue-500">Sign In</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="flex flex-col h-screen overflow-hidden hidden">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center space-x-4">
                <h1 class="text-xl font-bold text-gray-800">KanbanFlow Pro</h1>
                <div class="h-6 w-px bg-gray-300"></div>
                <span id="user-display" class="text-sm text-gray-600 font-medium"></span>
                <span id="role-badge" class="px-2 py-1 text-xs font-bold rounded-full bg-blue-100 text-blue-700"></span>
            </div>
            <div class="flex items-center space-x-4">
                <button id="btn-add-task" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition-colors">
                    + New Task
                </button>
                
                <!-- Profile Dropdown -->
                <div class="relative">
                    <button id="profile-menu-button" class="flex items-center focus:outline-none">
                        <img id="user-profile-icon" src="" alt="Profile" class="w-9 h-9 rounded-full border-2 border-transparent hover:border-blue-500 transition-colors shadow-sm">
                    </button>
                    
                    <div id="profile-dropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border border-gray-100 py-1 hidden z-[150]">
                        <div class="px-4 py-2 border-b border-gray-50">
                            <p id="dropdown-user-name" class="text-sm font-bold text-gray-800 truncate"></p>
                            <p id="dropdown-user-role" class="text-[10px] font-bold text-blue-600 uppercase"></p>
                        </div>
                        <button id="btn-dropdown-account" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Account
                        </button>
                        <button id="btn-dropdown-export" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Export Data
                        </button>
                        <div class="border-t border-gray-50 my-1"></div>
                        <button id="btn-dropdown-logout" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center font-medium">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Kanban Board Area -->
        <main id="kanban-board" class="flex-1 overflow-x-auto overflow-y-hidden p-6">
            <div class="flex h-full space-x-6 min-w-max">
                <!-- Columns will be injected here -->
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 pointer-events-none">
        <!-- Modals will be rendered here -->
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[200] space-y-3 pointer-events-none">
        <!-- Toasts will appear here -->
    </div>

    <script type="module" src="src/main_auth_forms.js"></script>
    <!-- Global Loading Spinner/Progress Bar -->
    <div id="global-spinner" class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center z-[1000] hidden">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500"></div>
    </div>

</body>
</html>
